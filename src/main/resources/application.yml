spring:
  datasource:
    url: jdbc:postgresql://appdb-instance.ck1qmoy0wjp6.us-east-1.rds.amazonaws.com:5432/appdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

cloud:
  aws:
    region:
      static: us-east-1   # 👈 must match where your secret lives
    credentials:
      instance-profile: true
    secretsmanager:
      enabled: true
      name: devops-secretmanager   # 👈 the Name of your secret in AWS
      prefix: ""                   # 👈 keep keys as-is (DB_USERNAME, DB_PASSWORD, DB_NAME)

logging:
  level:
    io.awspring.cloud.secretsmanager: DEBUG
    org.springframework.boot.context.config: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: env,health
