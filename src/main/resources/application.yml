spring:
  config:
    import: "aws-secretsmanager:devops-secretmanager"
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        instance-profile: true  # use IRSA to authenticate with AWS Secrets Manager

  datasource:
    url: jdbc:postgresql://appdb-instance.ck1qmoy0wjp6.us-east-1.rds.amazonaws.com:5432/appdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  level:
    io.awspring.cloud.secretsmanager: DEBUG
