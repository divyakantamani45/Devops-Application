apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: devops-app
  labels:
    app: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      serviceAccountName: devops-sa
      containers:
        - name: devops-app
          image: devops-ecr-prod/devops-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: AWS_REGION
              value: "us-east-1"
            - name: SPRING_CLOUD_AWS_SECRETSMANAGER_NAME
              value: "myapp-secretmanager"
          securityContext:                # ✅ Security context for the container
            runAsUser: 1000               # non-root user
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:                      # ✅ Resource limits (DoS protection)
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      securityContext:                    # ✅ Pod-level security context
        fsGroup: 2000                     # group ownership for mounted volumes
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: devops-app
  namespace: devops-app
  labels:
    app: devops-app
spec:
  selector:
    app: devops-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

