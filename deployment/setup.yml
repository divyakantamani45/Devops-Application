apiVersion: v1
kind: Namespace
metadata:
  name: devops-app


apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-sa
  namespace: devops-app
  annotations:
    # replace below IAM role ARN with the role you created for IRSA
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/devops-eks-prod-pod-role


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-app-ingress
  namespace: devops-app
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Replace with your ACM certificate ARN
    #alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    # Optional: redirect HTTP->HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    #- host: app.devops.com                       # replace with your DNS name
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-app
                port:
                  number: 80
